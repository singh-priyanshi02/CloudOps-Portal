
name: CloudOps - Build and Upload to S3

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ARTIFACT_BUCKET: cloudops-portal-artifacts-706421610833

jobs:
  build-upload:
    name: Build .NET and Upload Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Application
        run: dotnet publish "./CloudOps Portal.csproj" -c Release -o ./publish

      - name: Create ZIP
        run: |
          cd publish
          zip -r ../CloudOpsPortal.zip .
          cd ..

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Application to S3
        run: |
          aws s3 cp CloudOpsPortal.zip \
            s3://${{ env.ARTIFACT_BUCKET }}/releases/CloudOpsPortal.zip

      - name: Verify S3 Upload
        run: |
          aws s3 ls \
            s3://${{ env.ARTIFACT_BUCKET }}/releases/CloudOpsPortal.zip
